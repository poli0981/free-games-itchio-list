[package]
name = "free-games-itchio-webapp"
version = "3.9.0"
description = "Itch.io free games catalog browser & editor"
authors = ["poli0981"]
license = "MIT"
repository = "https://github.com/poli0981/free-games-itchio-list"
edition = "2021"
rust-version = "1.77"

[lib]
name = "free_games_itchio_webapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# time 0.3.48 (2026-06-12) fails to compile via tauri-utils (E0119,
# https://github.com/time-rs/time/issues/783). No Cargo.lock is committed, so
# pin the last good version until the upstream fix ships, then remove.
time = "=0.3.47"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
