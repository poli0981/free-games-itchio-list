# Qodana for JavaScript / TypeScript: the web app, the admin app, the Worker
# and the build scripts. Run by .github/workflows/qodana.yml (job
# `typescript`), reported to https://qodana.cloud/projects/wwgZ1.
version: "1.0"
linter: qodana-js
withinDocker: false
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      # Build output and reports.
      - dist
      - coverage
      # Generated by `npm run cf:types`.
      - worker-configuration.d.ts
      # The Tauri shell is the Rust project (src-tauri/qodana.yaml).
      - src-tauri
  # A Worker handler throws to its own catch on purpose: one place turns every
  # failure into the response (worker/gate.ts, worker/suggest.ts).
  - name: ExceptionCaughtLocallyJS
  # The escapes of } and ] stay: without them a pattern only parses in
  # non-unicode (Annex B) mode.
  - name: RegExpRedundantEscape
  # Catalog strings with typographic apostrophes are used as object keys.
  - name: JSNonASCIINames
  # The Node test scripts import by relative path: the @/ alias is Vite's.
  - name: ES6PreferShortImport
    paths:
      - scripts
