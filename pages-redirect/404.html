<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Moved to freeitchgames.win</title>
  <link rel="canonical" href="https://freeitchgames.win/">
  <noscript><meta http-equiv="refresh" content="0; url=https://freeitchgames.win/"></noscript>
  <script>
    (function () {
      // The old GitHub Pages app kept an encrypted PAT and GPG key in this
      // origin's localStorage. The new site has no sign-in, so clear them.
      try {
        [
          'webapp.pat.encrypted',
          'webapp.gpg.encrypted',
          'webapp.gpg.fingerprint',
          'webapp.gpg.uid',
          'webapp.gpg.emails',
          'webapp.gpg.enabled',
        ].forEach(function (k) { localStorage.removeItem(k) })
      } catch (e) { /* storage blocked: nothing to clear */ }
      // Keep in-app hash routes (#/games/slug) so shared links still land on the right page.
      var hash = location.hash.indexOf('#/') === 0 ? location.hash : ''
      location.replace('https://freeitchgames.win/' + hash)
    })()
  </script>
</head>
<body>
  <p>This site moved to <a href="https://freeitchgames.win/">freeitchgames.win</a>.</p>
  <p>Trang đã chuyển sang <a href="https://freeitchgames.win/">freeitchgames.win</a>.</p>
</body>
</html>
