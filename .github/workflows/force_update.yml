# Manual re-scrape of every scraper-owned field (repairs mojibake, backfills
# fields after a scraper upgrade). Always preserves safe_virus / notes / nsfw.
# Runs through refresh.yml in full mode: one URL, or a rotating batch of the
# games whose last full re-scrape is oldest — dispatch again to continue.
name: Force update

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'itch.io URL to re-scrape (optional; empty = next batch of the catalog)'
        required: false
        type: string
      budget:
        description: 'Batch size when no URL is given (0 = 1/7 of the catalog)'
        type: number
        default: 0
      allow_mass_removal:
        description: 'Apply removals even if the mass-change guard trips (confirm on itch.io first)'
        type: boolean
        default: false

permissions: {}

# FIFO (`queue: max`): with the default queue a newer pending dispatch would
# replace an older pending one and silently drop its `url`.
concurrency:
  group: force-update
  cancel-in-progress: false
  queue: max

jobs:
  rescrape:
    permissions:
      contents: write
    uses: ./.github/workflows/refresh.yml
    with:
      full: true
      url: ${{ inputs.url }}
      budget: ${{ inputs.budget }}
      allow_mass_removal: ${{ inputs.allow_mass_removal }}
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
