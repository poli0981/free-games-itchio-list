# Manual re-scrape of every scraper-owned field (repairs mojibake, backfills
# fields after a scraper upgrade). Always preserves safe_virus / notes / nsfw.
# Queues refresh.yml in full mode: one URL, or a rotating batch of the games
# whose last full re-scrape is oldest. Dispatch again to continue: the runs
# wait FIFO in refresh.yml's concurrency group and each batch starts from the
# latest main, so several dispatches in a row cover consecutive batches.
#
# A dispatch rather than a reusable-workflow call: called through `uses:`,
# refresh.yml failed at startup ("workflow file issue", no annotation).
name: Force update

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'itch.io URL to re-scrape (optional; empty = next batch of the catalog)'
        required: false
        type: string
      budget:
        description: 'Batch size when no URL is given (0 = 1/7 of the catalog)'
        type: number
        default: 0
      allow_mass_removal:
        description: 'Apply removals even if the mass-change guard trips (confirm on itch.io first)'
        type: boolean
        default: false

permissions: {}

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch refresh.yml (a workflow_dispatch from GITHUB_TOKEN does start a run)
    steps:
      - name: Queue a full refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          URL: ${{ inputs.url }}
          BUDGET: ${{ inputs.budget }}
          ALLOW_MASS_REMOVAL: ${{ inputs.allow_mass_removal }}
        run: |
          set -euo pipefail
          gh workflow run refresh.yml --ref "$REF" \
            -f full=true -f budget="$BUDGET" -f url="$URL" -f allow_mass_removal="$ALLOW_MASS_REMOVAL"
          echo "Queued a full refresh on \`$REF\` (budget $BUDGET${URL:+, $URL}) — see the Refresh catalog runs." \
            >> "$GITHUB_STEP_SUMMARY"
