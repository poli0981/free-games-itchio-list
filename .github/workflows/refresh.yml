# Daily rotating catalog health check (replaces check_paid / check_alive /
# update_reviews / update_status, which each crawled every page and timed out).
#
#   scan  — scripts/refresh.py checks ~1/7 of the catalog (one GET per game),
#           read-only, and uploads a patch (checkpointed, deadline-bound).
#   apply — applies the patch to the latest main and pushes (bash/commit_push.sh
#           re-applies on a fresh main if the push races another writer).
#   notify — Discord on failure / cancel / itch.io rate limit / mass change
#           (a run that would remove or strike an implausible share of games
#           — usually itch.io markup changes — withholds the removals).
#
# Also called by force_update.yml with `full: true` (re-scrape every field).
name: Refresh catalog

on:
  schedule:
    - cron: '47 2 * * *'   # daily; GitHub may start scheduled runs hours late
  workflow_dispatch:
    inputs:
      budget:
        description: 'Games to check (0 = 1/7 of the catalog)'
        type: number
        default: 0
      url:
        description: 'Only this game URL (optional)'
        type: string
        required: false
      allow_mass_removal:
        description: 'Apply removals even if the mass-change guard trips (confirm on itch.io first)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      budget:
        type: number
        default: 0
      url:
        type: string
        required: false
      full:
        type: boolean
        default: false
      allow_mass_removal:
        type: boolean
        default: false
    secrets:
      DISCORD_CI_WEBHOOK:
        required: false

permissions: {}

env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      rate_limited: ${{ steps.refresh.outputs.rate_limited }}
      mass_change: ${{ steps.refresh.outputs.mass_change }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check a slice of the catalog
        id: refresh
        timeout-minutes: 55
        env:
          BUDGET: ${{ inputs.budget || 0 }}
          URL: ${{ inputs.url }}
          FULL: ${{ inputs.full && 'true' || 'false' }}
          ALLOW_MASS_REMOVAL: ${{ inputs.allow_mass_removal && 'true' || 'false' }}
        run: |
          args=(--out "$RUNNER_TEMP/patch.json" --budget "$BUDGET" --deadline-min 45)
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          if [ "$ALLOW_MASS_REMOVAL" = "true" ]; then args+=(--allow-mass-removal); fi
          if [ -n "$URL" ]; then args+=(--url "$URL"); fi
          python scripts/refresh.py "${args[@]}"

      - name: Upload patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-patch
          path: ${{ runner.temp }}/patch.json
          retention-days: 7
          if-no-files-found: warn

  apply:
    needs: scan
    # Also apply the checkpointed patch of a scan that failed or timed out
    # (a timed-out step fails, it does not cancel) — but not of a cancelled run.
    if: ${{ !cancelled() && needs.scan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # FIFO: with the default queue a newer pending apply would replace (and
    # discard) an older pending one.
    concurrency:
      group: refresh-apply
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] — commit_push.sh pushes with this token
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refresh-patch
          path: ${{ runner.temp }}

      - name: Apply, validate and push
        env:
          KIND: ${{ inputs.full && 'Force update' || 'Refresh catalog' }}
          ALLOW_MASS_REMOVAL: ${{ inputs.allow_mass_removal && '1' || '0' }}
        run: bash bash/commit_push.sh "$RUNNER_TEMP/patch.json" "$KIND [$(date -u +%F)]"

  notify:
    needs: [scan, apply]
    if: >-
      always() && (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled') || needs.scan.outputs.rate_limited == 'true' ||
      needs.scan.outputs.mass_change == 'true')
    permissions: {}
    uses: ./.github/workflows/notify-failure.yml
    with:
      summary: >-
        scan=${{ needs.scan.result }}, apply=${{ needs.apply.result }},
        rate_limited=${{ needs.scan.outputs.rate_limited || 'false' }},
        mass_change=${{ needs.scan.outputs.mass_change || 'false' }}
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
