name: Export deleted games log
on:
  workflow_run:
    workflows:
      - 'Check paid games'
      - 'Check dead game links'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-deleted:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Export deleted games log
        run: |
          chmod +x ./bash/log_deleted.sh
          ./bash/log_deleted.sh
        shell: bash