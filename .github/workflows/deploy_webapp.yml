# LEGACY — the site now deploys from Cloudflare Workers Builds (webapp/wrangler.jsonc).
# This workflow only publishes the pages-redirect/ stub so old
# poli0981.github.io/free-games-itchio-list links forward to freeitchgames.win
# (and the stub clears the old in-browser PAT/GPG keys). Delete in v4 Phase 1;
# GitHub Pages keeps serving the last deployment.
name: Publish GitHub Pages redirect

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy_webapp.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: pages-redirect

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
