name: Generate Table of Game
on:
  workflow_run:
    workflows:
      - 'Update JSON file game information'
      - 'Check paid games'
      - 'Check dead game links'
      - 'Update reviews'
      - 'Update status'
      - 'Force update'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Generate markdown tables
        run: |
          chmod +x ./bash/table.sh
          ./bash/table.sh
        shell: bash