name: Announce Release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-announce"
        required: true
        type: string

permissions: {}

jobs:
  announce:
    # The reusable workflow fetches release metadata with the gh CLI.
    permissions:
      contents: read
    # Pinned to a commit of poli0981/.github; bump deliberately (Dependabot
    # github-actions updates it). Only the secrets it needs are passed.
    uses: poli0981/.github/.github/workflows/announce-release.yml@c3e118a01d40e95b36b2c3466dc206638c11eb5a
    with:
      tag_override: ${{ inputs.tag || '' }}
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      DISCORD_REPO_WEBHOOK: ${{ secrets.DISCORD_REPO_WEBHOOK }}
      DISCORD_PING_ROLE_ID: ${{ secrets.DISCORD_PING_ROLE_ID }}
