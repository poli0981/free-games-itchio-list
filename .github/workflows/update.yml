name: Update JSON file game information
on:
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      url:
        description: 'itch.io URL to add (optional; if empty, processes scripts/temp_link.json)'
        required: false
        type: string

permissions:
    contents: write

jobs:
  update-game-info:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Run bash script to update game info
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
            chmod +x ./bash/test.sh
            ./bash/test.sh
        shell: bash
