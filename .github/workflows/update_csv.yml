name: Export Data from JSON -> CSV
on:
  workflow_run:
    workflows:
      - 'Generate Table of Game'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  csv-export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Export CSV
        run: |
          chmod +x ./bash/export_csv.sh
          ./bash/export_csv.sh
        shell: bash