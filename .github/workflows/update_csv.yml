name: Export Data from JSON -> CSV
permissions:
    contents: write
on:
  schedule:
    - cron: '13 4 * * *' # 4:13 UTC
  workflow_dispatch:

jobs:
  csv-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Run bash script to export data
        run: |
          chmod +x ./bash/export_csv.sh
          ./bash/export_csv.sh
        shell: bash

