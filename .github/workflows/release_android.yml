name: Release Android APK (Tauri)

# Builds a signed, sideloadable arm64-v8a APK from the same React + Tauri app
# that release_desktop.yml ships for desktop.
#
# - On a `v*` tag: attaches the APK to the same DRAFT GitHub Release as the
#   desktop installers (nothing is published — release stays a draft until a
#   human publishes it).
# - On manual dispatch: uploads the APK as a workflow artifact so it can be
#   downloaded and device-tested without cutting a tag.
#
# `src-tauri/gen/android` is gitignored and regenerated by `tauri android init`
# on every run, so signing is done AFTER the build with zipalign + apksigner
# (no edits to generated Gradle). Order matters: zipalign BEFORE apksigner —
# re-aligning a signed APK breaks the signature.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Pin the NDK so CI matches local (a floating NDK is a classic
# "works locally, breaks in CI"). 27.3.x is the current stable LTS and is
# installed on the dev machine; to match locally, point NDK_HOME at the same
# version (otherwise Tauri picks the highest installed NDK).
env:
  NDK_VERSION: '27.3.13750724'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle` — the Gradle project lives in gen/android, which
          # is gitignored and only created later by `tauri android init`, so
          # there are no gradle files at checkout for setup-java to key on
          # (it hard-errors otherwise). rust-cache + npm cache still apply.

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: webapp/src-tauri

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools + platform
        # Tauri 2.11 generates compileSdk/targetSdk = 36, so provision android-36
        # and a matching build-tools (these versions match the dev machine).
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "build-tools;36.1.0" "platforms;android-36" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install npm deps
        working-directory: webapp
        run: npm ci

      - name: Initialize Android project
        working-directory: webapp
        run: npm run tauri -- android init

      - name: Build unsigned release APK (arm64-v8a)
        working-directory: webapp
        run: npm run tauri -- android build --apk --target aarch64

      - name: Sign APK (zipalign -> apksigner)
        id: sign
        working-directory: webapp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Highest installed build-tools (provides zipalign + apksigner).
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT="FreeGamesItchio_${VERSION}_arm64-v8a.apk"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk \
            -name "*-release-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No *-release-unsigned.apk found — build produced no unsigned APK."
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED"

          "$BT/zipalign" -v -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --verbose "$OUT"
          rm -f "$RUNNER_TEMP/release.jks" aligned.apk

          echo "apk_path=webapp/$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.apk_name }}
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error

      - name: Attach APK to draft release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # Create the draft if the desktop workflow hasn't yet (ordering-safe).
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --draft --notes "Pending installers."
          gh release upload "$TAG" "${{ steps.sign.outputs.apk_path }}" --repo "$REPO" --clobber
