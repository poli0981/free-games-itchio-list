name: Check dead game links
on:
  schedule:
    - cron: '0 7 */2 * *'   # Every 2 days at 07:00 UTC (3h after check_paid)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for dead links
        run: |
          chmod +x ./bash/check_alive.sh
          ./bash/check_alive.sh
        shell: bash