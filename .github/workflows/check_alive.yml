# Schedule removed 2026-09: full passes over 2,600+ games exceed the job timeout
# and lose all work. Replaced by the rotating refresh.yml in v4 Phase 1.
name: Check dead game links
on:
  workflow_dispatch:

# Unbuffered UTF-8 output so progress survives a timeout/cancel.
env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'

permissions:
  contents: write

jobs:
  check-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for dead links
        run: |
          chmod +x ./bash/check_alive.sh
          ./bash/check_alive.sh
        shell: bash