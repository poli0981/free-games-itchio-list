name: 🎮 Add Games
description: Suggest new free itch.io games (max 15 per issue pls)
title: "[Add Games] "
labels: ["contribution", "games"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks bro! This repo lives on additions because I'm too lazy to hunt alone :D Only free-to-play itch.io games.

  - type: dropdown
    id: count
    attributes:
      label: How many games? (max 15)
      options:
        - "1"
        - "2-5"
        - "6-10"
        - "11-15"
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Game Links (one per line!)
      description: |
        I'll check (no guarantee perfect). One link per line — two on same line? Your loss :v
      placeholder: |
        https://example.itch.io/game1
        https://example.itch.io/game2
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why these games? (optional)
      description: e.g. super fun, hidden gem, or just... free?

  - type: textarea
    id: notes
    attributes:
      label: Notes for table? (optional)
      description: Personal rating, warnings, etc. — I'll add to "Notes" column

  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement (required)
      options:
        - label: I agree — if this issue is off-topic, spam, or violates repo policy, it may be ignored/closed without response.
          required: true