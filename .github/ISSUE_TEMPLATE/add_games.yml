name: 🎮 Add Games (bulk list)
description: Got a whole list of free itch.io games? Use this. For one game, the Suggest page is faster.
title: "[Add Games] "
labels: ["contribution", "games"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks bro! This catalog lives on additions because I'm too lazy to hunt alone :D Only free-to-play itch.io games.

        **Just one game? Use the Suggest page instead: https://freeitchgames.win/suggest** — no GitHub account needed, and it goes straight into the review queue.
        This issue form is the fallback for **bulk lists** (several games at once).

        How it works either way: every link lands in a review queue, and nothing enters the catalog until the Maintainer approves it. Approved links are scraped by the data pipeline; paid games and games already in the catalog are skipped.

  - type: dropdown
    id: count
    attributes:
      label: How many games? (max 15)
      options:
        - "1"
        - "2-5"
        - "6-10"
        - "11-15"
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Game Links (one per line!)
      description: |
        itch.io game page links only (like `https://creator.itch.io/game`). One link per line — two on the same line? Your loss :v
      placeholder: |
        https://example.itch.io/game1
        https://example.itch.io/game2
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why these games? (optional)
      description: e.g. super fun, hidden gem, or just... free?

  - type: textarea
    id: notes
    attributes:
      label: Anything the Maintainer should know? (optional)
      description: Warnings (adult content, suspicious download, needs an account...), your personal take, etc. The Maintainer may use it for the game's `notes`, `nsfw` or `safe_virus` fields.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks (optional)
      options:
        - label: I searched https://freeitchgames.win/games and these games aren't listed yet
        - label: These games are free to play on itch.io (not paid)

  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement (required)
      options:
        - label: I agree — if this issue is off-topic, spam, or violates repo policy, it may be ignored/closed without response.
          required: true
