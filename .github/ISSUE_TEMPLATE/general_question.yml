name: ❓ General / Off-Topic
description: Anything not fitting other templates
title: "[General] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Not bug/feature/games/feedback? Drop it here. Memes welcome :D

  - type: textarea
    id: content
    attributes:
      label: What's on your mind?
      description: Questions, random thoughts, or just saying hi
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement (required)
      options:
        - label: I agree — if this issue is off-topic, spam, or violates repo policy, it may be ignored/closed without response.
    validations:
      required: true