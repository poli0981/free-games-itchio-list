name: 💡 Feature Request / Improvement
description: Suggest a new feature or code improvement
title: "[Feature/Improvement] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Yo legend! My code is mediocre at best, so ideas are welcome. Grok helps, but you might have better ones :D

  - type: checkboxes
    id: type
    attributes:
      label: Type (choose one only)
      options:
        - label: New Feature
        - label: Code Improvement
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Feature/Improvement Name
      description: Short title — what is it?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why? (e.g tables too slow, missing info, etc.)
      description: Explain the problem it solves or why it's cool/good for the repo.
    validations:
      required: true

  - type: checkboxes
    id: priority
    attributes:
      label: How necessary? (choose one only)
      options:
        - label: Not urgent (nice to have)
        - label: Maybe needed
        - label: Very needed
        - label: Extremely urgent (repo dying without it)
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: (Optional) Pseudo-code, snippet, or file idea
      description: |
        Share code ideas — I'll check (no malware pls, I'm paranoid and lazy :D). My skill is average, so keep it simple.

  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement (required)
      options:
        - label: I agree — if this issue is off-topic, spam, or violates repo policy, it may be ignored/closed without response.
          required: true