# Project tooling configuration.
#
# The repo has no Python build system — the scraper pipeline runs the
# scripts/ modules directly. Lint + dead-code tools configured here:
#   ruff check scripts/   — style, unused imports/variables
#   vulture               — dead code (unused functions, classes, attributes)

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "BLE", "S113"]

[tool.vulture]
paths = ["scripts", "webapp/scripts", "tests"]
min_confidence = 60
# Autouse pytest fixtures are used by pytest itself, not called by name.
ignore_names = ["no_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py blocks all network access; parser tests use saved fixtures.
addopts = "-q"
