# Project tooling configuration.
#
# Ruff is the only tool configured here: the repo has no Python build
# system — the scraper pipeline runs the scripts/ modules directly.
# Run it with:  ruff check scripts/

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
